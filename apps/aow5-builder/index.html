<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>AOW5 Build Planner</title>
    <meta
      name="description"
      content="Plan and share item builds for the Dota 2 custom game Age of Weapons 5. Builds live in the URL — no account, no server."
    />
    <script>
      // Applies the saved theme before first paint, so the page never flashes
      // the wrong one. Mirrors getInitialTheme() in src/lib/theme.ts — keep the
      // two in step.
      (function () {
        try {
          var stored = localStorage.getItem('aow5.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
